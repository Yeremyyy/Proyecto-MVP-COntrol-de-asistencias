<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="vista-login" class="contenedor activa">
        <div class="tarjeta">
            <h2>Ingreso al Sistema</h2>
            <form id="formulario-login">
                <div class="grupo-input">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" required>
                </div>
                <div class="grupo-input">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" required>
                </div>
                <p id="mensaje-error" class="texto-error"></p>
                <button type="submit" class="btn-primario">Iniciar Sesión</button>
            </form>
            <div style="margin-top: 30px; text-align: center; border-top: 1px solid #eee; padding-top: 20px;">
                <p style="font-size: 0.7rem; color: #666; margin-bottom: 10px;">¿Entrada física a la empresa?</p>
                <!-- Un enlace simple que reemplaza la ventana -->
                <a href="kiosco.html" style="text-decoration: none;">
                    <button type="button" class="btn-accion btn-entrada" style="width: 100%;">Modo Kiosco (Escanear QR)</button>
                </a>
            </div>
        </div>
    </div>
    

    <div id="vista-panel" class="contenedor">
        <div class="tarjeta tarjeta-ancha">
            <h2>Bienvenido, <span id="nombre-usuario"></span></h2>
            <p class="reloj" id="reloj-actual">00:00:00</p>
            
            
            <!-- SECCIÓN: CALENDARIO DE ASISTENCIA Y JUSTIFICACIÓN -->
            <div style="margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; text-align: left;">
                <h3 style="font-size: 1rem; margin-bottom: 15px; color: #333;">Mi Calendario de Asistencia</h3>
                <p style="font-size: 0.75rem; color: #666; margin-bottom: 10px;">Haz clic en un día con inasistencia (rojo) para justificarlo.</p>
                
                <!-- Cuadrícula del Calendario -->
                <div id="calendario-empleado" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 20px; text-align: center;">
                    <!-- Se inyectará dinámicamente con JS -->
                </div>

                <!-- Formulario dinámico que aparece al seleccionar un día -->
                <div id="contenedor-formulario-fecha" style="background: #f9f9f9; padding: 15px; border: 1px solid #ddd; display: none;">
                    <h4 id="titulo-fecha-seleccionada" style="font-size: 0.9rem; margin-bottom: 10px; color: #000;">Justificar fecha: </h4>
                    <form id="formulario-justificacion-calendario">
                        <input type="hidden" id="fecha-objetivo">
                        <div class="grupo-input">
                            <input type="text" id="motivo-falta" placeholder="Motivo (Ej: Licencia médica, calamidad...)" required>
                        </div>
                        <div class="grupo-input">
                            <input type="file" id="archivo-licencia-calendario" accept=".pdf, image/*" required style="border: none; padding: 0;">
                        </div>
                        <button type="submit" class="btn-primario" style="background-color: #0056b3; font-size: 0.8rem; padding: 8px;">Enviar Justificación</button>
                        <p id="mensaje-validacion-calendario" class="texto-estado" style="font-size: 0.8rem; margin-top: 10px;"></p>
                    </form>
                </div>
            </div>

            <button id="btn-cerrar-sesion" class="btn-texto">Cerrar Sesión</button>
        </div>
    </div>

    <div id="vista-admin" class="contenedor">
        <div class="tarjeta tarjeta-ancha">
            <h2>Panel de Administración</h2>
            <p style="font-size: 0.8rem; color: #666; text-transform: uppercase; margin-bottom: 20px;">
                Sesión: <span id="nombre-admin" style="font-weight: bold; color: #000;"></span>
            </p>
            
            <div class="grupo-botones">
                <button id="btn-generar-reporte" class="btn-accion btn-entrada">Generar Reporte de Atrasos</button>
            </div>
            
       
            <div id="contenedor-reporte" style="margin-top: 20px;"></div>
            
            <button id="btn-cerrar-sesion-admin" class="btn-texto">Cerrar Sesión</button>
        </div>
    </div>


    <script src="../src/clases.js"></script>
    <script src="./app.js"></script>
    <script src="./empleado.js"></script>
</body>
</html>
